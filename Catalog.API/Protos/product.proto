syntax = "proto3";

option csharp_namespace = "Catalog.API.Protos";

service ProductProtoService {
  rpc GetProduct (GetProductRequest) returns (ProductModel);
}

message GetProductRequest {
  string id = 1;
}

message ProductModel {
  string id = 1;
  string name = 2;
  string description = 3;
  string imageFile = 4;
  double price = 5;
  string category = 6;
}